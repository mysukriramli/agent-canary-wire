name: Agent Canary 30-Min Pulse

on:
  schedule:
    # Runs every 30 minutes, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canary-pulse:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install lightweight dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Execute Canary Pulse Check
        run: |
          python3 pulse.py

      - name: Commit and push updates
        run: |
          git config user.name "canary-bot[bot]"
          git config user.email "canary-bot@users.noreply.github.com"
          git add latest/
          
          if git diff --staged --quiet; then
            echo "No gateway status changes detected. Skipping commit."
          else
            git commit -m "chore(canary): update AI provider pulse [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
