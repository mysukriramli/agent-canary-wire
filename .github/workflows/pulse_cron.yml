name: Agent Canary 30-Min Pulse

on:
  schedule:
    # Runs every 30 minutes at off-peak minutes 12 and 42 past the hour
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canary-pulse:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Execute Canary Pulse Check
        run: |
          python3 pulse.py

      - name: Commit and push updates
        run: |
          git config user.name "canary-bot[bot]"
          git config user.email "canary-bot@users.noreply.github.com"
          git add -A latest/
          
          if git diff --staged --quiet; then
            echo "No gateway status changes detected. Skipping commit."
          else
            git commit -m "chore(canary): update AI provider pulse [skip ci]"
            git push origin main
          fi
