name: Agent Canary 30-Min Pulse

on:
  schedule:
    # Runs at 12 and 42 minutes past every hour (bypasses :00 and :30 queue traffic)
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canary-pulse:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Execute Canary Pulse Check
        run: |
          python3 pulse.py

      - name: Commit and push updates
        run: |
          git config user.name "canary-bot[bot]"
          git config user.email "canary-bot@users.noreply.github.com"
          git add latest/
          
          if git diff --staged --quiet; then
            echo "No gateway status changes detected. Skipping commit."
          else
            git commit -m "chore(canary): update AI provider pulse [skip ci]"
            git push origin main
          fi
